# this config does not support variable-size;
# it is only meant to be used for atlastop uncertainty studies
_target_: experiments.tagging.wrappers.PELICANLiteWrapper
out_channels: null
units: null

net:
 _target_: pelican.nets.PELICAN
 _partial_: true
 size: -2  # set lr when using with training=jc

 in_channels_rank0: 0
 in_channels_rank1: null
 in_channels_rank2: 1
 out_rank: 0
 out_channels: 1

 num_blocks: 5
 hidden_channels: 72
 increase_hidden_channels: 0.59

 map_multipliers: true
 factorize: false
 activation: leaky_relu
 aggr: mean
 compile: true
 checkpoint_blocks: false

defaults:
 - framesnet: identity
