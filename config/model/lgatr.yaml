_target_: experiments.tagging.wrappers.LGATrWrapper
mean_aggregation: false
out_channels: null
use_amp: false
attention_backend: xformers
units: null
zeropad: false

net:
 _target_: lgatr.LGATr
 _partial_: true
 size: 0

 in_mv_channels: 1
 in_s_channels: null
 out_mv_channels: null
 out_s_channels: null

 hidden_mv_channels: ${eval:'int(round(2 ** (${model.net.size}+4)))'}
 hidden_s_channels: ${eval:'int(round(3 * 2 ** (${model.net.size}+5)))'}
 num_blocks: ${eval:'int(round(3 * 2 ** ((${model.net.size}+3)/2)))'}

 attention:
  num_heads: ${eval:'int(round(2 ** (3 + (${model.net.size} // 2))))'}
  multi_query: false
  attn_ratio: 1
  head_scale: false
 mlp:
  nonlinearity: gelu
  mlp_ratio: 2
 primitives:
  sparse_gp: true
  sparse_linear: false
  bivector: true
  geometric_product: true
  subgroup: true

 checkpoint_blocks: false
 naive_amp: false
 compile: true
 compile_kwargs:
  dynamic: true
  mode: default

defaults:
  - framesnet: identity
