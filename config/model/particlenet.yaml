# this config does not support variable-size;
# it is only meant to be used for atlastop uncertainty studies
_target_: experiments.tagging.wrappers.ParticleNetWrapper
in_channels: null
out_channels: null

net:
 _target_: lloca.backbone.particlenet.ParticleNet
 _partial_: true
 size: -2  # set lr when using with training=jc

 num_classes: null
 conv_params: [[16, [64, 64, 64]], [16, [128, 128, 128]], [16, [256, 256, 256]]]
 fc_params: [[256, 0.1]]
 input_dims: null
 hidden_reps_list: ["7x0n", "32x0n+8x1n", "64x0n+16x1n"]
 use_fusion: false

defaults:
 - framesnet: identity
