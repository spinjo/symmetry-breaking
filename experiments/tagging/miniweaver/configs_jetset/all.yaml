selection: ak.any(tracks_valid, axis=-1) & ak.all((tracks_E < 10000000) | ~np.isfinite(tracks_E), axis=-1)
   ### use `&`, `|`, `~` for logical operations on numpy arrays
   ### can use functions from `math`, `np` (numpy), and `awkward` in the expression

new_variables:
   ### [format] name: formula
   ### can use functions from `math`, `np` (numpy), and `awkward` in the expression
   label_isLight: (jets_HadronConeExclTruthLabelID == 0)
   label_isCharm: (jets_HadronConeExclTruthLabelID == 4)
   label_isBottom: (jets_HadronConeExclTruthLabelID == 5)
   label_isTau: (jets_HadronConeExclTruthLabelID == 15)

inputs:
   # tracks_* (mean, 1/std) from gitlab.cern.ch/atlas/open-data/transforming-jet-flavor
   pf_features:
      length: 40
      pad_mode: constant
      vars:
      ### [format 1]: var_name (no transformation)
      ### [format 2]: [var_name,
      ###              subtract_by(optional, default=None, no transf. if preprocess.method=manual, auto transf. if preprocess.method=auto),
      ###              multiply_by(optional, default=1),
      ###              clip_min(optional, default=None, no lower clip if None),
      ###              clip_max(optional, default=None, no upper clip if None),
      ###              pad_value(optional, default=0)]
         - [tracks_qOverP, 1.8e-6, 2.0e+3]
         - [tracks_deta, -6.5e-6, 8]
         - [tracks_dphi, 1.3e-4, 7.9]
         - [tracks_d0, -8.4e-4, 1.8]
         - [tracks_z0SinTheta, 2.2e-4, 0.87]
         - [tracks_qOverPUncertainty, 7.1e-6, 1.2e+5]
         - [tracks_thetaUncertainty, 1.3e-3, 960]
         - [tracks_phiUncertainty, 1.8e-3, 530]
         - [tracks_lifetimeSignedD0Significance, 1.8, 0.12]
         - [tracks_lifetimeSignedZ0SinThetaSignificance, 0.84, 0.11]
         - [tracks_numberOfPixelHits, 4, 1]
         - [tracks_numberOfSCTHits, 8.1, 0.69]
         - [tracks_numberOfInnermostPixelLayerHits, 0.97, 2.6]
         - [tracks_numberOfNextToInnermostPixelLayerHits, 0.97, 2.3]
         - [tracks_numberOfInnermostPixelLayerSharedHits, 0.02, 7.2]
         - [tracks_numberOfInnermostPixelLayerSplitHits, 0.019, 6.9]
         - [tracks_numberOfPixelSharedHits, 0.036, 5.4]
         - [tracks_numberOfPixelSplitHits, 0.047, 3.4]
         - [tracks_numberOfSCTSharedHits, 0.16, 2.2]
   pf_vectors:
      length: 40
      pad_mode: constant
      vars:
         ### rescale by 1.e-3: MeV → GeV
         - [tracks_E,  0, 1.e-3]
         - [tracks_px, 0, 1.e-3]
         - [tracks_py, 0, 1.e-3]
         - [tracks_pz, 0, 1.e-3]

labels:
   ### type can be `simple`, `custom`
   ### [option 1] use `simple` for binary/multi-class classification, then `value` is a list of 0-1 labels
   type: simple
   value: [label_isLight, label_isCharm, label_isBottom, label_isTau]
   ### [option 2] otherwise use `custom` to define the label, then `value` is a map
   # type: custom
   # value:
   #    truth_label: label.argmax(1)

weights:
